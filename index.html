<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>크루즈 특가 — 부산 출발 크루즈 비교</title>
  <style>
    :root {
      --bg: #0f1923;
      --card: #1a2736;
      --border: #2a3a4a;
      --text: #e0e6ed;
      --muted: #8899aa;
      --accent: #4fc3f7;
      --hot: #ff6b6b;
      --gold: #ffd54f;
      --green: #66bb6a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }

    /* Header */
    header {
      text-align: center;
      padding: 32px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.8em; margin-bottom: 8px; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); font-size: 0.95em; }
    .stats {
      display: flex; gap: 24px; justify-content: center;
      margin-top: 16px; flex-wrap: wrap;
    }
    .stat-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 20px; text-align: center;
    }
    .stat-box .num { font-size: 1.5em; font-weight: bold; color: var(--accent); }
    .stat-box .label { font-size: 0.8em; color: var(--muted); }

    /* Tabs */
    .tabs {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .tab {
      padding: 8px 16px; border-radius: 6px; cursor: pointer;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); font-size: 0.9em; transition: all 0.2s;
    }
    .tab.active, .tab:hover {
      background: var(--accent); color: var(--bg); border-color: var(--accent);
    }

    /* Controls */
    .controls {
      display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
      align-items: center;
    }
    .controls input, .controls select {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 8px 12px; border-radius: 6px;
      font-size: 0.9em;
    }
    .controls input { flex: 1; min-width: 200px; }
    .controls select { min-width: 120px; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
    th {
      background: var(--card); color: var(--accent); padding: 10px 8px;
      text-align: left; cursor: pointer; white-space: nowrap;
      border-bottom: 2px solid var(--border); user-select: none;
      position: sticky; top: 0; z-index: 1;
    }
    th:hover { color: var(--gold); }
    td {
      padding: 8px; border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tr:hover td { background: rgba(79, 195, 247, 0.05); }

    /* Scores */
    .score { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.85em; }
    .score.hot3 { background: #c62828; color: #fff; }
    .score.hot2 { background: #e65100; color: #fff; }
    .score.hot1 { background: #1565c0; color: #fff; }
    .score.normal { color: var(--muted); }

    .star { color: var(--gold); }
    .busan-tag { background: var(--green); color: #000; padding: 1px 6px; border-radius: 3px; font-size: 0.8em; font-weight: bold; }
    .discount { color: var(--hot); font-weight: bold; }
    .price { color: var(--green); font-weight: bold; }
    .per-night { color: var(--muted); font-size: 0.85em; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Detail modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 100; justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; max-width: 600px; width: 90%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal h2 { margin-bottom: 12px; color: var(--accent); }
    .modal .close { float: right; cursor: pointer; font-size: 1.5em; color: var(--muted); }
    .modal .close:hover { color: var(--text); }
    .modal .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .modal .row .label { color: var(--muted); }

    /* Price history chart */
    .chart-container { margin-top: 16px; }

    .footer {
      text-align: center; padding: 24px; color: var(--muted);
      font-size: 0.8em; border-top: 1px solid var(--border); margin-top: 32px;
    }

    @media (max-width: 768px) {
      .controls { flex-direction: column; }
      .controls input { min-width: 100%; }
      header h1 { font-size: 1.3em; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🚢 크루즈 <span>특가</span></h1>
    <p>부산 출발 크루즈 + 아시아 특가 딜 한눈에 비교</p>
    <div class="stats">
      <div class="stat-box"><div class="num" id="totalCount">-</div><div class="label">전체 크루즈</div></div>
      <div class="stat-box"><div class="num" id="busanCount">-</div><div class="label">부산 출발</div></div>
      <div class="stat-box"><div class="num" id="dealCount">-</div><div class="label">50%+ 특가</div></div>
      <div class="stat-box"><div class="num" id="updateTime">-</div><div class="label">마지막 업데이트</div></div>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <div class="tab active" data-filter="all">전체</div>
      <div class="tab" data-filter="busan">부산 출발</div>
      <div class="tab" data-filter="deal80">80%+ 초특가</div>
      <div class="tab" data-filter="deal50">50%+ 특가</div>
      <div class="tab" data-filter="cheap">$100/박 이하</div>
      <div class="tab" data-filter="luxury">럭셔리 (5⭐+)</div>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="검색 (선사, 배, 일정, 항구...)">
      <select id="sortSelect">
        <option value="price-asc">가격 낮은순</option>
        <option value="price-desc">가격 높은순</option>
        <option value="date-asc">출발일 빠른순</option>
        <option value="date-desc">출발일 늦은순</option>
        <option value="discount-desc">할인율 높은순</option>
        <option value="deal-desc">딜스코어 높은순</option>
        <option value="value-desc">가성비 높은순</option>
        <option value="pernight-asc">박당가격 낮은순</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="num">#</th>
            <th data-sort="line">선사</th>
            <th data-sort="ship">배</th>
            <th data-sort="rating">⭐</th>
            <th data-sort="date">출발일</th>
            <th data-sort="nights">박</th>
            <th data-sort="itinerary">일정</th>
            <th data-sort="inside">내측</th>
            <th data-sort="pernight">박당</th>
            <th data-sort="discount">할인</th>
            <th data-sort="deal">딜</th>
            <th data-sort="value">가성비</th>
            <th>링크</th>
          </tr>
        </thead>
        <tbody id="cruiseTable"></tbody>
      </table>
    </div>
    <p style="text-align:center;margin-top:12px;color:var(--muted);font-size:0.85em;" id="resultCount"></p>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="footer">
    데이터 출처: cruisetmk.kr, cruisebooking.co.kr, vacationstogo.com<br>
    매시 자동 업데이트 | 가격은 세금 포함
  </div>

  <script>
    let allCruises = [];
    let currentFilter = 'all';
    let currentSort = 'price-asc';

    async function loadData() {
      try {
        const res = await fetch('data/cruises-public.json');
        const data = await res.json();
        allCruises = data.cruises;

        document.getElementById('totalCount').textContent = data.count;
        document.getElementById('busanCount').textContent = allCruises.filter(c => c.isBusanRelated).length;
        document.getElementById('dealCount').textContent = allCruises.filter(c => c.discountPct >= 50).length;

        const updated = new Date(data.exportedAt);
        const kst = updated.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        document.getElementById('updateTime').textContent = kst;

        render();
      } catch (e) {
        document.getElementById('cruiseTable').innerHTML = '<tr><td colspan="13" style="text-align:center;padding:40px;">데이터 로딩 실패</td></tr>';
      }
    }

    function getLowestPrice(c) {
      const p = c.cabinPrices || {};
      const prices = [p.inside, p.oceanview, p.balcony, p.suite].filter(v => v > 0);
      return prices.length > 0 ? Math.min(...prices) : Infinity;
    }

    function getInsidePerNight(c) {
      if (!c.nights || c.nights <= 0) return Infinity;
      const price = (c.cabinPrices && c.cabinPrices.inside) || getLowestPrice(c);
      return price / c.nights;
    }

    function getBestDealScore(c) {
      const s = c.dealScores || {};
      const vals = Object.values(s);
      return vals.length > 0 ? Math.max(...vals) : 0;
    }

    function getBestValueScore(c) {
      const s = c.valueScores || {};
      const vals = Object.values(s);
      return vals.length > 0 ? Math.max(...vals) : 0;
    }

    function filterCruises(list) {
      const search = document.getElementById('searchInput').value.toLowerCase();
      let filtered = list;

      if (currentFilter === 'busan') filtered = filtered.filter(c => c.isBusanRelated);
      else if (currentFilter === 'deal80') filtered = filtered.filter(c => c.discountPct >= 80);
      else if (currentFilter === 'deal50') filtered = filtered.filter(c => c.discountPct >= 50);
      else if (currentFilter === 'cheap') filtered = filtered.filter(c => getInsidePerNight(c) < 100);
      else if (currentFilter === 'luxury') filtered = filtered.filter(c => c.shipRating && c.shipRating >= 5);

      if (search) {
        filtered = filtered.filter(c =>
          (c.cruiseLine || '').toLowerCase().includes(search) ||
          (c.shipName || '').toLowerCase().includes(search) ||
          (c.itinerary || '').toLowerCase().includes(search) ||
          (c.departurePort || '').toLowerCase().includes(search) ||
          (c.departureDate || '').includes(search) ||
          String(c.num).includes(search)
        );
      }
      return filtered;
    }

    function sortCruises(list) {
      const s = currentSort;
      return [...list].sort((a, b) => {
        if (s === 'price-asc') return getLowestPrice(a) - getLowestPrice(b);
        if (s === 'price-desc') return getLowestPrice(b) - getLowestPrice(a);
        if (s === 'date-asc') return (a.departureDate || '').localeCompare(b.departureDate || '');
        if (s === 'date-desc') return (b.departureDate || '').localeCompare(a.departureDate || '');
        if (s === 'discount-desc') return (b.discountPct || 0) - (a.discountPct || 0);
        if (s === 'deal-desc') return getBestDealScore(b) - getBestDealScore(a);
        if (s === 'value-desc') return getBestValueScore(b) - getBestValueScore(a);
        if (s === 'pernight-asc') return getInsidePerNight(a) - getInsidePerNight(b);
        return 0;
      });
    }

    function scoreHtml(val) {
      if (!val && val !== 0) return '<span class="score normal">-</span>';
      let cls = 'normal';
      if (val >= 80) cls = 'hot3';
      else if (val >= 60) cls = 'hot2';
      else if (val >= 40) cls = 'hot1';
      return `<span class="score ${cls}">${val}</span>`;
    }

    function formatPrice(val) {
      if (!val || val === Infinity) return '-';
      return '$' + val.toLocaleString();
    }

    function ratingStars(r) {
      if (!r) return '-';
      return '<span class="star">' + '⭐'.repeat(Math.min(Math.floor(r), 6)) + (r % 1 ? '½' : '') + '</span>';
    }

    function truncate(str, len) {
      if (!str) return '';
      return str.length > len ? str.substring(0, len) + '...' : str;
    }

    function render() {
      const filtered = filterCruises(allCruises);
      const sorted = sortCruises(filtered);
      const tbody = document.getElementById('cruiseTable');

      document.getElementById('resultCount').textContent = `${sorted.length}개 크루즈`;

      if (sorted.length === 0) {
        tbody.innerHTML = '<tr><td colspan="13" style="text-align:center;padding:40px;color:var(--muted);">결과 없음</td></tr>';
        return;
      }

      tbody.innerHTML = sorted.map(c => {
        const lowest = getLowestPrice(c);
        const pn = c.perNight && c.perNight.inside ? c.perNight.inside : (c.nights > 0 && lowest < Infinity ? Math.round(lowest / c.nights) : null);
        const bestDeal = getBestDealScore(c);
        const bestValue = getBestValueScore(c);

        return `<tr onclick="showDetail(${c.num})" style="cursor:pointer">
          <td>${c.num || ''}</td>
          <td>${c.cruiseLine || ''}</td>
          <td>${truncate(c.shipName, 20)}</td>
          <td>${c.shipRating ? c.shipRating + '⭐' : '-'}</td>
          <td>${c.departureDate || '-'}</td>
          <td>${c.nights || '-'}</td>
          <td title="${c.itinerary || ''}">${truncate(c.itinerary, 30)} ${c.isBusanRelated ? '<span class="busan-tag">부산</span>' : ''}</td>
          <td class="price">${formatPrice(c.cabinPrices && c.cabinPrices.inside ? c.cabinPrices.inside : lowest)}</td>
          <td class="per-night">${pn ? '$' + pn + '/박' : '-'}</td>
          <td>${c.discountPct ? '<span class="discount">' + c.discountPct + '%</span>' : '-'}</td>
          <td>${scoreHtml(bestDeal || null)}</td>
          <td>${scoreHtml(bestValue || null)}</td>
          <td><a href="${c.bookingUrl}" target="_blank" onclick="event.stopPropagation()">예약</a></td>
        </tr>`;
      }).join('');
    }

    function showDetail(num) {
      const c = allCruises.find(x => x.num === num);
      if (!c) return;

      const prices = c.cabinPrices || {};
      const pn = c.perNight || {};
      const ds = c.dealScores || {};
      const vs = c.valueScores || {};

      let priceRows = '';
      for (const [type, label] of [['inside','내측'], ['oceanview','바다전망'], ['balcony','발코니'], ['suite','스위트']]) {
        if (prices[type]) {
          priceRows += `<div class="row">
            <span class="label">${label}</span>
            <span>$${prices[type].toLocaleString()} ${pn[type] ? '($' + pn[type] + '/박)' : ''} ${ds[type] ? '딜' + ds[type] : ''} ${vs[type] ? '가성비' + vs[type] : ''}</span>
          </div>`;
        }
      }

      let historyHtml = '';
      if (c.priceHistory && c.priceHistory.length > 1) {
        historyHtml = '<h3 style="margin-top:16px;color:var(--accent);">가격 변동</h3>';
        for (const h of c.priceHistory.slice(-10)) {
          const d = new Date(h.date).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          const p = h.prices || {};
          const vals = [p.inside, p.oceanview, p.balcony, p.suite].filter(v => v > 0).map(v => '$' + v.toLocaleString());
          historyHtml += `<div class="row"><span class="label">${d}</span><span>${vals.join(' / ') || '-'}</span></div>`;
        }
      }

      document.getElementById('modalContent').innerHTML = `
        <h2>#${c.num} ${c.cruiseLine} ${c.shipName} ${c.shipRating ? c.shipRating + '⭐' : ''}</h2>
        <div class="row"><span class="label">일정</span><span>${c.itinerary || '-'}</span></div>
        <div class="row"><span class="label">출발</span><span>${c.departureDate} | ${c.nights}박${c.days}일</span></div>
        <div class="row"><span class="label">출발항</span><span>${c.departurePort || '-'}</span></div>
        ${c.discountPct ? `<div class="row"><span class="label">할인</span><span class="discount">${c.discountPct}% (원가 $${(c.origPrice||0).toLocaleString()})</span></div>` : ''}
        <h3 style="margin-top:16px;color:var(--accent);">객실별 가격</h3>
        ${priceRows || '<div class="row"><span>가격 정보 없음</span></div>'}
        ${historyHtml}
        <div style="margin-top:16px;text-align:center;">
          <a href="${c.bookingUrl}" target="_blank" style="display:inline-block;padding:10px 24px;background:var(--accent);color:var(--bg);border-radius:8px;font-weight:bold;text-decoration:none;">예약 페이지 →</a>
        </div>
      `;
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    // Event listeners
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        render();
      });
    });

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      render();
    });

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Header sort
    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const map = {
          num: 'price-asc', line: 'price-asc', ship: 'price-asc',
          rating: 'price-asc', date: 'date-asc', nights: 'price-asc',
          itinerary: 'price-asc', inside: 'price-asc', pernight: 'pernight-asc',
          discount: 'discount-desc', deal: 'deal-desc', value: 'value-desc',
        };
        const sortKey = map[th.dataset.sort] || 'price-asc';
        document.getElementById('sortSelect').value = sortKey;
        currentSort = sortKey;
        render();
      });
    });

    loadData();
  </script>
</body>
</html>
